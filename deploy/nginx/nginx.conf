# Balanceador de carga: Nginx na frente de duas instâncias do backend.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;  # não revela a versão do Nginx

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # upstream=<ip:porta> mostra QUAL instância atendeu cada requisição.
    log_format lb '$remote_addr [$time_local] "$request" $status '
                  'rt=$request_time upstream=$upstream_addr req_id=$request_id';
    access_log /dev/stdout lb;

    upstream backend_pool {
        # Round-robin (padrão). Uma instância com 3 falhas seguidas sai da rotação por 10 s.
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;
        client_max_body_size 1m;

        # Métricas são internas: o Prometheus coleta direto dos backends, não pelo público.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            # Sobrescreve (não acrescenta) o X-Forwarded-For: o cliente não consegue forjar o IP.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
